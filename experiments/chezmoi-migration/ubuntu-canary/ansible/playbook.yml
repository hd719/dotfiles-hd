---
- name: Prepare the disposable chezmoi Ubuntu canary
  hosts: all
  connection: local
  become: true
  gather_facts: true

  vars:
    canary_user: hamel
    canary_home: /home/hamel
    canary_packages:
      - build-essential
      - btop
      - ca-certificates
      - curl
      - git
      - ghostty
      - jq
      - libbz2-dev
      - libffi-dev
      - liblzma-dev
      - libreadline-dev
      - libsqlite3-dev
      - libssl-dev
      - lsd
      - openssh-client
      - pkg-config
      - sudo
      - tmux
      - unzip
      - uuid-dev
      - xz-utils
      - zlib1g-dev
      - zsh
      - zsh-autosuggestions
      - zsh-syntax-highlighting

  tasks:
    - name: Install the minimum Ubuntu user-environment dependencies
      ansible.builtin.apt:
        name: "{{ canary_packages }}"
        state: present
        update_cache: true
        install_recommends: false

    - name: Create the credential-free canary user
      ansible.builtin.user:
        name: "{{ canary_user }}"
        home: "{{ canary_home }}"
        create_home: true
        shell: /usr/bin/zsh
        password_lock: true

    - name: Create the canary SSH directory
      ansible.builtin.file:
        path: "{{ canary_home }}/.ssh"
        state: directory
        owner: "{{ canary_user }}"
        group: "{{ canary_user }}"
        mode: "0700"

    - name: Verify the isolated canary identity
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.architecture == "aarch64"
          - ansible_facts.hostname == "chezmoi-ubuntu-canary"
