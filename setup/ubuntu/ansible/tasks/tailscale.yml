---
- name: Install the Tailscale repository key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/resolute.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"

- name: Configure the Tailscale repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/tailscale.list
    owner: root
    group: root
    mode: "0644"
    content: |
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu resolute main

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable Tailscale
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started

- name: Check whether Tailscale is already connected
  ansible.builtin.command:
    cmd: tailscale ip -4
  register: tailscale_ip
  changed_when: false
  failed_when: false

- name: Join Tailscale with the one-time auth key
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - "--auth-key={{ tailscale_auth_key }}"
      - "--hostname={{ workstation_hostname }}"
      - --accept-routes=false
      - --accept-dns=true
      - --ssh=false
  when:
    - tailscale_auth_key | length > 0
    - tailscale_ip.stdout is not match('^100\.')
  changed_when: true
  no_log: true

- name: Remove temporary Tailscale provision data
  ansible.builtin.file:
    path: /tmp/ubuntu-workstation-secrets.json
    state: absent
  changed_when: false
  no_log: true
