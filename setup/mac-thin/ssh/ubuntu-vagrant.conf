# Canary aliases work directly with `uc` and `uct`. At cutover, include this
# file before old Ubuntu blocks so the final aliases take precedence.

Host ubuntu-vm-canary
  HostName 127.0.0.1
  Port 2222
  User hamel
  AddressFamily inet
  IdentityFile ~/.ssh/id_ed25519_ubuntu_vm
  IdentitiesOnly yes
  ForwardAgent no
  HostKeyAlias ubuntu-dev-canary
  StrictHostKeyChecking yes

Host ubuntu-vm-canary-ts
  HostName ubuntu-dev-canary
  User hamel
  AddressFamily inet
  IdentityFile ~/.ssh/id_ed25519_ubuntu_vm
  IdentitiesOnly yes
  ForwardAgent no
  HostKeyAlias ubuntu-dev-canary
  StrictHostKeyChecking yes

Host ubuntu-vm
  HostName 127.0.0.1
  Port 2222
  User hamel
  AddressFamily inet
  IdentityFile ~/.ssh/id_ed25519_ubuntu_vm
  IdentitiesOnly yes
  ForwardAgent no
  HostKeyAlias ubuntu-dev
  StrictHostKeyChecking yes

Host ubuntu-vm-ts
  HostName ubuntu-dev
  User hamel
  AddressFamily inet
  IdentityFile ~/.ssh/id_ed25519_ubuntu_vm
  IdentitiesOnly yes
  ForwardAgent no
  HostKeyAlias ubuntu-dev
  StrictHostKeyChecking yes
