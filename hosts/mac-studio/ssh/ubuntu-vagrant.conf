# Include this file before older Ubuntu blocks so these routes take precedence.

Host ubuntu-vm
  HostName 127.0.0.1
  Port 2222
  User hamel
  AddressFamily inet
  IdentityFile ~/.ssh/id_ed25519_ubuntu_vm
  IdentitiesOnly yes
  ForwardAgent no
  HostKeyAlias ubuntu-dev
  StrictHostKeyChecking yes

Host ubuntu-vm-ts
  HostName ubuntu-dev
  User hamel
  AddressFamily inet
  IdentityFile ~/.ssh/id_ed25519_ubuntu_vm
  IdentitiesOnly yes
  ForwardAgent no
  HostKeyAlias ubuntu-dev
  StrictHostKeyChecking yes
