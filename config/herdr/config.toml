# Herdr config
# Source of truth: ~/Developer/dotfiles-hd/config/herdr/config.toml

onboarding = false

[theme]
name = "terminal"

[theme.custom]
# Nord accents for status text, separators, and the top bar.
overlay1 = "#88c0d0"
overlay0 = "#81a1c1"
panel_bg = "reset"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
# Match Kuncheng's Herdr prefix and keep Escape free for Neovim.
prefix = "ctrl+b"

# Tmux-like session/app controls.
help = "prefix+?"
detach = "prefix+d"
reload_config = "prefix+r"

# Workspaces.
workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
# Direct (no-prefix) chords to cycle the vertical workspace list continuously:
# hold Ctrl+Alt and tap j (down/next) or k (up/previous).
next_workspace = "ctrl+alt+j"
previous_workspace = "ctrl+alt+k"

# Tabs map to tmux windows.
new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
# Direct (no-prefix) chords so tabs can be cycled continuously: hold Ctrl+Alt
# and tap h/l to move prev/next without re-pressing the prefix each time.
previous_tab = "ctrl+alt+h"
next_tab = "ctrl+alt+l"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"

# Panes.
edit_scrollback = "prefix+e"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+shift+r"
toggle_sidebar = "prefix+b"

# Navigate-mode movement.
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

[ui]
sidebar_width = 26
sidebar_min_width = 18
sidebar_max_width = 36
mouse_capture = true
confirm_close = true
prompt_new_tab_name = false
agent_panel_sort = "priority"
status_indicators = "symbols"
pane_borders = true
pane_gaps = true
accent = "#88c0d0"
tab_bar_right = [
  { type = "hostname" },
  { type = "command", command = 'bash "$HOME/Developer/dotfiles-hd/config/herdr/status.sh" system', interval_seconds = 10, timeout_seconds = 3 },
  { type = "command", command = 'bash "$HOME/Developer/dotfiles-hd/config/herdr/status.sh" docker', interval_seconds = 5, timeout_seconds = 3 },
  { type = "command", command = 'bash "$HOME/Developer/dotfiles-hd/config/herdr/status.sh" k8s', interval_seconds = 5, timeout_seconds = 3 },
  { type = "command", command = 'bash "$HOME/Developer/dotfiles-hd/config/herdr/status.sh" aws', interval_seconds = 5, timeout_seconds = 3 },
]
tab_bar_right_separator = " · "

[ui.sidebar.agents]
rows = [
  ["state_icon", "agent", "state_text"],
  ["machine", "workspace", "tab"],
]

[ui.toast]
delivery = "terminal"
delay_seconds = 2

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
kitty_graphics = true
pane_history = true

[advanced]
scrollback_limit_bytes = 20000000
