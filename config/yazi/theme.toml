# Hamel Nord for Yazi.
# Palette matches Ghostty Hamel Nord Blur and config/btop/themes/hamel-nord.theme.
# Leave [app].overall unset so Ghostty's blurred #3b4252 background shows through.

#:schema https://yazi-rs.github.io/schemas/theme.json

[mgr]
cwd = { fg = "#88c0d0" }

find_keyword = { fg = "#ebcb8b", bold = true, italic = true, underline = true }
find_position = { fg = "#b48ead", bg = "reset", bold = true, italic = true }

symlink_target = { fg = "#81a1c1", italic = true }

marker_copied = { fg = "#a3be8c", bg = "#a3be8c" }
marker_cut = { fg = "#bf616a", bg = "#bf616a" }
marker_marked = { fg = "#88c0d0", bg = "#88c0d0" }
marker_selected = { fg = "#ebcb8b", bg = "#ebcb8b" }

count_copied = { fg = "#3b4252", bg = "#a3be8c" }
count_cut = { fg = "#3b4252", bg = "#bf616a" }
count_selected = { fg = "#3b4252", bg = "#ebcb8b" }

border_symbol = "│"
border_style = { fg = "#4c566a" }

# Read from the checkout, like Ghostty's shader, so no extra Chezmoi link.
syntect_theme = "~/Developer/dotfiles-hd/config/yazi/hamel-nord.tmTheme"

[tabs]
active = { fg = "#3b4252", bg = "#88c0d0", bold = true }
inactive = { fg = "#88c0d0", bg = "#434c5e" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#3b4252", bg = "#88c0d0", bold = true }
normal_alt = { fg = "#88c0d0", bg = "#434c5e" }
select_main = { fg = "#3b4252", bg = "#b48ead", bold = true }
select_alt = { fg = "#b48ead", bg = "#434c5e" }
unset_main = { fg = "#3b4252", bg = "#d08770", bold = true }
unset_alt = { fg = "#d08770", bg = "#434c5e" }

[indicator]
parent = { fg = "#d8dee9", bg = "#434c5e" }
current = { fg = "#3b4252", bg = "#88c0d0" }
preview = { fg = "#88c0d0", underline = true }
padding = { open = "", close = "" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_sep = { fg = "#4c566a" }
perm_type = { fg = "#88c0d0" }
perm_read = { fg = "#ebcb8b" }
perm_write = { fg = "#bf616a" }
perm_exec = { fg = "#a3be8c" }
progress_label = { fg = "#d8dee9", bold = true }
progress_normal = { fg = "#a3be8c", bg = "#434c5e" }
progress_error = { fg = "#ebcb8b", bg = "#bf616a" }

[which]
border = { fg = "#88c0d0" }
cols = 3
cand = { fg = "#88c0d0" }
rest = { fg = "#4c566a" }
desc = { fg = "#b48ead" }
separator = " -> "
separator_style = { fg = "#4c566a" }

[confirm]
border = { fg = "#88c0d0" }
title = { fg = "#88c0d0" }
btn_yes = { fg = "#3b4252", bg = "#a3be8c", bold = true }
btn_no = { fg = "#d8dee9", bg = "#434c5e" }

[spot]
border = { fg = "#88c0d0" }
title = { fg = "#88c0d0" }
tbl_col = { fg = "#81a1c1" }
tbl_cell = { fg = "#ebcb8b", bg = "#434c5e" }

[notify]
title_info = { fg = "#a3be8c" }
title_warn = { fg = "#ebcb8b" }
title_error = { fg = "#bf616a" }

[pick]
border = { fg = "#88c0d0" }
active = { fg = "#b48ead", bold = true }

[input]
border = { fg = "#88c0d0" }
selected = { fg = "#3b4252", bg = "#88c0d0" }

[cmp]
border = { fg = "#88c0d0" }
active = { fg = "#3b4252", bg = "#88c0d0" }

[tasks]
border = { fg = "#88c0d0" }
hovered = { fg = "#b48ead", bold = true }

[help]
border = { fg = "#88c0d0" }
chord = { fg = "#88c0d0" }
action = { fg = "#b48ead" }
hovered = { fg = "#3b4252", bg = "#88c0d0", bold = true }

[filetype]
rules = [
  { mime = "image/*", fg = "#8fbcbb" },
  { mime = "{audio,video}/*", fg = "#ebcb8b" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#b48ead" },
  { mime = "application/{pdf,doc,rtf}", fg = "#a3be8c" },
  { mime = "vfs/{absent,stale}", fg = "#4c566a" },
  { url = "*", is = "orphan", fg = "#bf616a" },
  { url = "*", is = "exec", fg = "#a3be8c" },
  { url = "*", is = "link", fg = "#b48ead" },
  { url = "*/", fg = "#81a1c1" },
  { url = "*", fg = "#d8dee9" },
]

